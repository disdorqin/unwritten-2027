<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UNWRITTEN 2027 · 钟楼广场样片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17283e;color:#fff4de;font:15px system-ui}canvas{display:block;touch-action:none}.panel{position:fixed;top:22px;left:24px;max-width:330px;padding:18px 22px;background:#17283edb;border:1px solid #f6ce902f;border-radius:16px;pointer-events:none}h1{font:500 24px Georgia,serif;margin:5px 0 12px}small{letter-spacing:3px;color:#dfbd83}p{line-height:1.7;color:#c9d6e4;margin:5px 0}button{font:inherit;background:#b64834;color:#fff4de;border:1px solid #db9a6d60;border-radius:10px;padding:10px 16px;cursor:pointer;touch-action:none}#enter{position:fixed;bottom:30px;left:50%;transform:translateX(-50%)}#crosshair{position:fixed;top:50%;left:50%;width:5px;height:5px;border-radius:100%;background:#fff9;pointer-events:none}.touch{position:fixed;bottom:25px;display:none;gap:7px}#move{left:15px;grid-template-columns:repeat(3,44px)}.touch button{padding:12px 0;background:#253b50cb}#jump{right:20px;bottom:35px;position:fixed;display:none}#move button:first-child{grid-column:2}#move button:nth-child(2){grid-column:1}#error{color:#ffb6a9}@media(pointer:coarse){.touch{display:grid}#jump{display:block}#enter{bottom:150px}.panel{left:12px;top:12px;padding:13px;max-width:270px}h1{font-size:20px}}
</style>
<div id="world"></div><div class="panel"><small>UNWRITTEN 2027</small><h1>雪夜 · 钟楼广场</h1><p id="status">正在加载模型与场景…</p><p>WASD 行走 · 鼠标转向 · 空格跳跃<br>手机：方向键行走，滑动右侧转向</p><p>首版场景样片 · 当前为单人预览<br>钟楼内部、其他建筑及多人接入待完成</p><p id="error"></p></div>
<div id="crosshair"></div><button id="enter">进入广场</button>
<div class="touch" id="move"><button data-key="KeyW">↑</button><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div><button id="jump" data-key="Space">跳跃</button>
<script type="module" src="/src/client/town-preview.ts"></script>
</html>
