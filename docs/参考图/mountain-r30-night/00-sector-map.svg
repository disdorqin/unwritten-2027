<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#182636"/><text x="48" y="55" fill="#f2f4ef" font-family="sans-serif" font-size="30" font-weight="bold">后山四战区施工分界</text><text x="48" y="86" fill="#a6bcc6" font-family="sans-serif" font-size="17">分界沿现有主峰局部坐标，所有区块仍使用同一地形及域变换。北朝上。</text><g transform="translate(65 121)"><rect width="660" height="540" rx="9" fill="#dbe4e3"/><rect y="393" width="660" height="147" fill="#a9c5ab"/><rect width="240" height="393" fill="#a6b9cf"/><rect x="240" width="180" height="393" fill="#d8c0a0"/><rect x="420" width="240" height="393" fill="#b8c7b8"/><path d="M0 393H660M240 0V393M420 0V393" stroke="#3e5058" stroke-width="2" stroke-dasharray="7 5"/><path d="M330 540L330 528Q245 447 160 380T200 295T328 238T345 130" stroke="#7e653b" stroke-width="4" stroke-dasharray="8 6" fill="none"/><circle cx="345" cy="237" r="8" fill="#b34f3b"/><circle cx="165" cy="267" r="7" fill="#465b69"/><circle cx="507" cy="213" r="7" fill="#465b69"/><text x="20" y="30" font-family="sans-serif" font-size="23" fill="#253b4a">B 西区</text><text x="253" y="30" font-family="sans-serif" font-size="23" fill="#253b4a">D2 中区</text><text x="438" y="30" font-family="sans-serif" font-size="23" fill="#253b4a">C2 东区</text><text x="25" y="420" font-family="sans-serif" font-size="24" fill="#253b4a">A 南入口 / 南谷</text><text x="20" y="453" font-family="sans-serif" font-size="17" fill="#253b4a">N ∈ [-10, 480)</text><text x="12" y="64" font-family="sans-serif" font-size="17" fill="#253b4a">E &lt; -300</text><text x="251" y="64" font-family="sans-serif" font-size="16" fill="#253b4a">-300 ≤ E &lt; 300</text><text x="440" y="64" font-family="sans-serif" font-size="17" fill="#253b4a">E ≥ 300</text><text x="12" y="265" font-family="sans-serif" font-size="17" fill="#253b4a">西肩560m</text><text x="353" y="229" font-family="sans-serif" font-size="17" fill="#253b4a">800m</text><text x="515" y="207" font-family="sans-serif" font-size="17" fill="#253b4a">东肩610m</text><text x="340" y="528" font-family="sans-serif" font-size="17" fill="#253b4a">山门</text></g><g transform="translate(765 127)"><text x="0" y="25" font-family="sans-serif" font-size="24" fill="#e9e5d7">共同坐标 · 单一地形权威</text><text x="0" y="70" font-family="sans-serif" font-size="17" fill="#e9e5d7">全域 E: -1100 … 1100</text><text x="0" y="104" font-family="sans-serif" font-size="17" fill="#e9e5d7">全域 N: -10 … 1790</text><text x="0" y="148" font-family="sans-serif" font-size="17" fill="#e9e5d7">A 约 1.078 km²</text><text x="0" y="181" font-family="sans-serif" font-size="17" fill="#e9e5d7">B 约 1.048 km²</text><text x="0" y="214" font-family="sans-serif" font-size="17" fill="#e9e5d7">C2 约 1.048 km²</text><text x="0" y="247" font-family="sans-serif" font-size="17" fill="#e9e5d7">D2 约 0.786 km²</text><text x="0" y="305" font-family="sans-serif" font-size="17" fill="#e9e5d7">边界 32m 重叠只读校验</text><text x="0" y="339" font-family="sans-serif" font-size="17" fill="#e9e5d7">同一采样、共享锚点</text><text x="0" y="373" font-family="sans-serif" font-size="17" fill="#e9e5d7">跨区道路不重造</text><text x="0" y="407" font-family="sans-serif" font-size="17" fill="#e9e5d7">虚线仅示意，不是施工路线</text><text x="0" y="455" font-family="sans-serif" font-size="17" fill="#e9e5d7">D2 总装，A 生产入口</text><text x="0" y="489" font-family="sans-serif" font-size="17" fill="#e9e5d7">B 缆车权威；C2 道路统筹</text></g><text x="48" y="731" fill="#9eb0ba" font-family="sans-serif" font-size="15">UNWRITTEN 2027 · 原创施工示意 · 非实景截图、非新地形权威</text></svg>