# 窗 C 认领 · U-10 勇士城建筑群先行

- 认领日期：2026-11-21，依据交流区 Muse《工包-U-10-勇士城建筑群建模先行》及《任务书-勇士城细化》。
- 责任边界：仅承建石屋排房 YS4、无字拱廊 YS4、90 米可走城墙段 YS5 的可认证局部预制件、净空/入口/实体装饰与动作钩子；不触碰公共 viewer.ts、不抢主窗城门/主街五段/勇士像/铁匠锻造，不造怪物伤害或掉落。
- 分支流程：先 push lane-c；四轮分批做结构→打磨→精修→互动；分区二/总装树串行审阅后再合 town-blockout-integration。若其他窗口已有同一 U-10 的施工成果，应先比对归属并停止重叠部分。
- 正式验收：仅在 U-15 −165 独立域的真实脚点/入口/移动碰撞完成注册，并从默认出生点连续走到后才报挂载。当前仍为在建，不能标已上线。
- 本轮已读 Muse 新文件：无新增；复读《任务书-勇士城细化》及 U-10 工包摘要（在总装树可读取）。
