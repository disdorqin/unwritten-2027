<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680"><rect width="1120" height="680" rx="20" fill="#172532"/><g font-family="sans-serif" fill="#e8eef2"><text x="40" y="53" font-size="30" font-weight="bold">地下四层 · 一次完整下潜与返程</text><text x="40" y="84" font-size="17" fill="#acbdca">拓扑剖面 / 深度为正典；各层局部坐标、跨域锚点由 C/C2 测定</text><rect x="50" y="110" width="280" height="53" rx="7" fill="#705f50" stroke="#a8b8be"/><text x="67" y="143" fill="#f1d6ab" font-size="19">坑底绞盘 / 井口 / 蛇石</text><path d="M190 163V201" fill="none" stroke="#d8af6c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="190" y="204" width="720" height="78" rx="7" fill="#4c5555" stroke="#a1a8aa"/><text x="210" y="230" fill="#f2dec4" font-size="22">−90 m  一矿</text><text x="210" y="256" fill="#e2e9ec" font-size="19">醒点 · 碎笼 → 营地 → 矿道 / 晶洞</text><text x="650" y="229" fill="#9cc6d0" font-size="16">暖光、木铁支护</text><rect x="190" y="305" width="720" height="78" rx="7" fill="#375361" stroke="#a1a8aa"/><text x="210" y="331" fill="#f2dec4" font-size="22">−140 m  二矿</text><text x="210" y="357" fill="#e2e9ec" font-size="19">泵房 → 暗河 / 摆渡 → 常通干绕道</text><text x="650" y="330" fill="#9cc6d0" font-size="16">冷水、晶辉与暖灯</text><rect x="190" y="406" width="720" height="78" rx="7" fill="#504f5a" stroke="#a1a8aa"/><text x="210" y="432" fill="#f2dec4" font-size="22">−165 m  勇士城</text><text x="210" y="458" fill="#e2e9ec" font-size="19">城门 → 180m级主街 → 冷焰 / 炉芯</text><text x="650" y="431" fill="#9cc6d0" font-size="16">石构城景、月光石</text><rect x="190" y="507" width="720" height="78" rx="7" fill="#464951" stroke="#a1a8aa"/><text x="210" y="533" fill="#f2dec4" font-size="22">−190 m  地宫</text><text x="210" y="559" fill="#e2e9ec" font-size="19">前厅 → 宝库门前 → 封闭核心舱</text><text x="650" y="532" fill="#9cc6d0" font-size="16">高拱、石雕、幽光</text><path d="M490 282V305" fill="none" stroke="#d8af6c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M490 383V406" fill="none" stroke="#d8af6c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M490 484V507" fill="none" stroke="#d8af6c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M912 546H1010V242H915" fill="none" stroke="#9bc5a8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="925" y="400" fill="#9bc5a8" font-size="18">回程链</text><text x="48" y="235" fill="#e0bb86" font-size="18">C：接线 / 一矿</text><text x="48" y="337" fill="#e0bb86" font-size="18">C2：二矿</text><text x="48" y="438" fill="#e0bb86" font-size="18">C2：古城</text><text x="48" y="539" fill="#e0bb86" font-size="18">C2：门前</text><text x="40" y="646" fill="#c2d1da" font-size="17">从人造矿业向远古文明过渡，地表不可透视地下；不提前开放宝库内部或沉船核心。</text></g></svg>