services:
  web:
    image: unwritten-town-preview:${TOWN_RELEASE:-local}
    build:
      context: ..
      dockerfile: tools/Dockerfile.town-preview
      args:
        TOWN_RELEASE: ${TOWN_RELEASE:-local}
        TOWN_REHEARSAL_BUILD: ${TOWN_REHEARSAL_BUILD:-off}
    restart: unless-stopped
    environment:
      TOWN_PREVIEW_SITE: ${TOWN_PREVIEW_SITE:-town.disdorqin.cn}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  presence:
    image: unwritten-town-presence:${TOWN_RELEASE:-local}
    build:
      context: ..
      dockerfile: tools/Dockerfile.town-presence
      args:
        TOWN_RELEASE: ${TOWN_RELEASE:-local}
        TOWN_REHEARSAL_BUILD: ${TOWN_REHEARSAL_BUILD:-off}
    restart: unless-stopped
    environment:
      PRESENCE_HOST: "0.0.0.0"
      PRESENCE_PORT: "8090"
      PRESENCE_TIERS: "${PRESENCE_TIERS:-}"
      TEST_FIREWORKS: "${TEST_FIREWORKS:-off}"
      TOWN_REHEARSAL_AT: "${TOWN_REHEARSAL_AT:-}"
    expose:
      - "8090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  certificates:
  caddy_config:
