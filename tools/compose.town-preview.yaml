services:
  web:
    image: unwritten-town-preview:${TOWN_RELEASE:-local}
    build:
      context: ..
      dockerfile: tools/Dockerfile.town-preview
      args:
        TOWN_RELEASE: ${TOWN_RELEASE:-local}
        TOWN_REHEARSAL_BUILD: ${TOWN_REHEARSAL_BUILD:-off}
    restart: unless-stopped
    environment:
      TOWN_PREVIEW_SITE: ${TOWN_PREVIEW_SITE:-town.disdorqin.cn}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  presence:
    image: unwritten-town-presence:${TOWN_RELEASE:-local}
    build:
      context: ..
      dockerfile: tools/Dockerfile.town-presence
      args:
        TOWN_RELEASE: ${TOWN_RELEASE:-local}
        TOWN_REHEARSAL_BUILD: ${TOWN_REHEARSAL_BUILD:-off}
    restart: unless-stopped
    environment:
      PRESENCE_HOST: "0.0.0.0"
      PRESENCE_PORT: "8090"
      PRESENCE_MOUNTAIN_PORT: "8091"
      PRESENCE_WEST_PORT: "8092"
      PRESENCE_MINE_PORT: "8094"
      PRESENCE_MINE2_PORT: "8095"
      # Isolated summit-v1 room. The transport permission remains closed
      # until total-control certifies the actual normal-entry walking route.
      PRESENCE_SUMMIT_PORT: "8096"
      PRESENCE_SUMMIT_RELEASE: "${PRESENCE_SUMMIT_RELEASE:-off}"
      # Do not open the sky room before ZB-22/G-01/ZB-17 transfer authorization is live.
      PRESENCE_SKY_PORT: "${PRESENCE_SKY_PORT:-}"
      TOWN_NIGHT_SCHEDULE: "${TOWN_NIGHT_SCHEDULE:-}"
      TOWN_NIGHT_BEACON_RECEIPT: "${TOWN_NIGHT_BEACON_RECEIPT:-}"
      PRESENCE_TIERS: "${PRESENCE_TIERS:-}"
      TEST_FIREWORKS: "${TEST_FIREWORKS:-off}"
      TOWN_REHEARSAL_AT: "${TOWN_REHEARSAL_AT:-}"
      OWNER_KEY: "${OWNER_KEY:-}"
    expose:
      - "8090"
      - "8091"
      - "8092"
      - "8093"
      - "8094"
      - "8095"
      - "8096"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  certificates:
  caddy_config:
