<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>未写镇 · 水晶洞走查</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080d16; color: #d6e6ef; font: 16px/1.45 system-ui, sans-serif; }
    main { width: min(100%, 1200px); margin: auto; padding: clamp(.75rem, 3vw, 2rem); }
    h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin: 0 0 .3rem; }
    p { margin: 0 0 1rem; color: #a9c0cf; }
    #cave-scene { height: min(72vh, 660px); min-height: 19rem; position: relative; border: 1px solid #394e64; border-radius: .5rem; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline-offset: -2px; }
    output { position: absolute; left: .8rem; bottom: .8rem; pointer-events: none; padding: .4rem .6rem; border-radius: .25rem; background: #0e1924d9; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>水晶洞走查</h1>
    <p>W / A / S / D 行走，拖动画面转向。大厅东侧通往月光石脉，水潭右岸通往出口。</p>
    <div id="cave-scene"><output id="cave-location"></output></div>
  </main>
  <script type="module" src="./town-blockout/underground-crystal-cave-review.ts"></script>
</body>
</html>
