<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>未写镇 · 雪翼试飞</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; color: #edf4fa; background: #adc2dc; }
    body { margin: 0; min-height: 100vh; }
    #scene, #vignette { position: fixed; inset: 0; }
    #scene canvas { display: block; }
    #vignette { pointer-events: none; visibility: hidden; background: radial-gradient(ellipse at center, transparent 43%, #192434a6); }
    #vignette[data-active=true] { visibility: visible; }
    main { position: relative; max-width: min(25rem, calc(100% - 4rem)); margin: 1rem; padding: .8rem 1rem; border-radius: .6rem; background: #19293bee; }
    h1 { margin: 0 0 .4rem; font-size: 1.1rem; }
    p { margin: .3rem 0 0; }
    #flight-reading { display: block; margin-top: .5rem; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <main>
    <h1>雪翼试飞</h1>
    <p>E 登记与领翼，W 沿小屋正门走到南侧雪崖。</p>
    <p>起飞后 W/S 俯冲与抬头，A/D 转向。</p>
    <p id="flight-status" role="status">在绝顶小屋登记。</p>
    <output id="flight-reading" aria-live="off"></output>
  </main>
  <script type="module" src="./town-blockout/main-summit-snow-wing-review.ts"></script>
</body>
</html>
