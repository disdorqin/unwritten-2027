<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>未写镇 · 云海观景亭</title>
  <style>
    :root { background: #b9cadd; color: #f5f7fb; font: 14px system-ui, sans-serif; }
    body { margin: 0; }
    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; }
    main { position: relative; display: grid; gap: .6rem; width: fit-content; max-width: calc(100% - 3rem); margin: 1rem; padding: .85rem 1rem; border: 1px solid #dce8f066; border-radius: .5rem; background: #233348eb; }
    h1, p { margin: 0; }
    h1 { font-size: 1.15rem; }
    nav { display: flex; flex-wrap: wrap; gap: .35rem; }
    button { padding: .35rem .65rem; border: 1px solid #a8bfd0; border-radius: .25rem; background: #344b65; color: inherit; font: inherit; }
    button[aria-pressed="true"] { background: #e2eef7; color: #1e3245; }
    button:focus-visible { outline: 2px solid #dceaff; outline-offset: 2px; }
    #position { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <main>
    <h1>云海观景亭</h1>
    <nav aria-label="观景亭位置">
      <button id="lower-cloud" type="button">下亭</button>
      <button id="upper-cloud" type="button">上亭</button>
    </nav>
    <nav aria-label="机位">
      <button id="approach" type="button">看亭身</button>
      <button id="center" type="button">亭内看云</button>
    </nav>
    <p>在亭内用方向键转向，按 Home 回到观景中线。</p>
    <output id="position"></output>
  </main>
  <script type="module" src="./town-blockout/main-summit-pavilions-review.ts"></script>
</body>
</html>
