<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FR-15 空间分区天气场 · 预览</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --ink: #e5edf8;
      --muted: #93a5bd;
      --panel: #0f1a2c;
      --panel-2: #142238;
      --line: #26374f;
      --accent: #7dd3fc;
      --warm: #fbbf24;
      --danger: #fb7185;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #08111f; color: var(--ink); font-family: "Microsoft YaHei", system-ui, sans-serif; }
    body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    #clock { color: var(--accent); font: 13px ui-monospace, monospace; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .85fr); gap: 14px; align-items: start; }
    .panel { background: linear-gradient(180deg, var(--panel), #0b1525); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .6px; }
    #map { display: block; width: 100%; height: 520px; border-radius: 10px; background: #0a1424; }
    #chart { display: block; width: 100%; height: 190px; margin-top: 12px; border-radius: 10px; background: #0a1424; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .controls button { border: 1px solid var(--line); background: #16263d; color: var(--ink); border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
    .controls button.active { border-color: var(--accent); background: #143349; color: var(--accent); }
    .controls .group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .controls .label { width: 100%; color: var(--muted); font-size: 11px; margin-top: 8px; }
    #summary { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 12px 0; font-size: 12px; color: var(--muted); }
    #summary b { color: var(--ink); font-family: ui-monospace, monospace; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid #1d2c42; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    td { font-family: ui-monospace, monospace; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-top: 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    footer { color: var(--muted); font-size: 11px; line-height: 1.6; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      #map { height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>FR-15 · 空间分区天气场</h1>
      <p>单一 Presence 权威天气 × 高程 / 区域 / 陨石坑 / 地图边缘 → 平滑本地场；预览为示意高程，生产传入真实地形</p>
    </div>
    <div id="clock">whiteout · visibility · 北线</div>
  </header>

  <div class="layout">
    <section class="panel">
      <h2>同一天气状态下的区域差异</h2>
      <canvas id="map"></canvas>
      <canvas id="chart"></canvas>
      <div class="legend">
        <span><i style="background:#7dd3fc"></i>雪势</span>
        <span><i style="background:#fbbf24"></i>恶劣度</span>
        <span><i style="background:#fb7185"></i>能见度（越低越红）</span>
      </div>
    </section>

    <section class="panel">
      <h2>基础天气（服务端权威）</h2>
      <div class="controls">
        <div class="group">
          <button data-weather="clear-snow">晴雪</button>
          <button data-weather="wind">飞雪</button>
          <button data-weather="whiteout">暴雪</button>
        </div>
        <div class="label">着色</div>
        <div class="group">
          <button data-mode="visibility">能见度</button>
          <button data-mode="snow">雪势</button>
          <button data-mode="severity">恶劣度</button>
        </div>
        <div class="label">剖面</div>
        <div class="group">
          <button data-transect="north">小镇 → 山脚 → 高山 → 主峰</button>
          <button data-transect="east">西缘 → 小镇 → 东缘</button>
        </div>
      </div>

      <div id="summary"></div>

      <table>
        <thead>
          <tr><th>取样点</th><th>区域</th><th>恶劣度</th><th>雪势</th><th>能见度</th><th>风</th></tr>
        </thead>
        <tbody id="readout"></tbody>
      </table>
    </section>
  </div>

  <footer>
    一个状态 → 同一场天气；区域内按高程/地形权重连续渐变，无逐点随机、无第二套排期。
    主峰暴雪仍保持约 12 m 能见度；小镇在同一权威状态下显著 milder。
  </footer>

  <script type="module" src="./town-blockout/town-weather-field-preview.ts"></script>
</body>
</html>
