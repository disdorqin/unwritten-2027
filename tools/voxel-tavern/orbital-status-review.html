<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轨道舱状态走查</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #e5ecf5; background: #101823; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 1000px; margin: 22px auto; padding: 0 20px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 8px 0; }
    #status-viewport { aspect-ratio: 16 / 9; min-height: 180px; border: 1px solid #3b4d5f; background: #151f2b; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    output { display: block; margin-top: 9px; }
  </style>
</head>
<body>
  <main>
    <h1>轨道舱状态走查</h1>
    <p>WASD 行走，方向键或拖动视野转向。走到控制台两手位之间，同时按 Q 与 E，空格翻阅。</p>
    <div id="status-viewport"></div>
    <output id="status-line" aria-live="polite"></output>
  </main>
  <script type="module" src="./town-blockout/orbital-status-review.ts"></script>
</body>
</html>
