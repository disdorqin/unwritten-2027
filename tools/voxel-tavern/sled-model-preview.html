<!doctype html>
<html lang="zh"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>未写镇雪橇资产审核</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a3046}
#info{position:absolute;top:22px;left:25px;color:#fff;font:20px sans-serif;text-shadow:0 2px 4px #111;pointer-events:none}
</style></head><body><div id="info">未写镇 · 雪橇与雪夜补给棚 / 模型验收预览</div>
<script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,Color,AmbientLight,DirectionalLight,
  PlaneGeometry,MeshLambertMaterial,Mesh} from 'three';
import {createTownSledVisuals} from './town-blockout/sled-visuals.ts';
const scene=new Scene();scene.background=new Color('#213b54');
scene.add(new AmbientLight('#f6eeef',2.2));
const sun=new DirectionalLight('#fff4d8',2.9);sun.position.set(-4,9,5);scene.add(sun);
const ground=new Mesh(new PlaneGeometry(18,18),new MeshLambertMaterial({color:'#d1dfec'}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.045;scene.add(ground);
const sled=createTownSledVisuals(scene,[{x:-.8,n:0,y:0,yaw:0}]);sled.setPose(2.3,-.1,.01,-.2);
const camera=new PerspectiveCamera(42,innerWidth/innerHeight,.01,70);
camera.position.set(5.8,3.45,6.4);camera.lookAt(.35,1.02,0);
const renderer=new WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
renderer.render(scene,camera);
const gl=renderer.getContext();const data=new Uint8Array(4);
gl.readPixels(Math.floor(renderer.domElement.width/2),Math.floor(renderer.domElement.height/2),1,1,gl.RGBA,gl.UNSIGNED_BYTE,data);
window.__sledAudit={renderCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,
pixel:[...data],objectNames:scene.children.map(x=>x.name),canvas:[renderer.domElement.width,renderer.domElement.height]};
</script></body></html>
