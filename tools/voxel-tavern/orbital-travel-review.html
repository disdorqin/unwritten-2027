<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轨道舱传送流程走查</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a1420; color: #e6edf6 }
    body { margin: 0 }
    header, main { width: min(1080px, calc(100% - 32px)); margin: 16px auto }
    h1, p { margin: 8px 0 }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px }
    button { font: inherit; padding: .4rem .65rem }
    #view { position: relative; height: min(61vh, 540px); min-height: 250px; border: 1px solid #416071; background: #152433; touch-action: none }
    #travel-cover { position: absolute; inset: 0; background: #000; z-index: 1; pointer-events: none }
    canvas { display: block; height: 100%; width: 100% }
    [aria-pressed="true"] { outline: 2px solid #d0aa75 }
    output { display: block; min-height: 1.35em }
  </style>
</head>
<body>
  <header>
    <h1>轨道舱传送流程走查</h1>
    <p>WASD 行走，方向键左右转向，E 使用近处门。验收定位只切换样场，之后须走到标记。</p>
  </header>
  <main>
    <div class="controls" id="fixtures" aria-label="验收定位"></div>
    <div id="view" aria-label="第一人称走查画面"><div id="travel-cover" aria-hidden="true" hidden></div></div>
    <output id="current" aria-live="polite"></output>
    <output id="result" aria-live="polite"></output>
    <div class="controls" id="hub" aria-label="传送室中枢" hidden></div>
  </main>
  <script type="module" src="./town-blockout/orbital-travel-review.ts"></script>
</body>
</html>
