name: Verify main summit cable P-2

on:
  push:
    branches: [lane-d]
    paths:
      - .github/workflows/verify-p2.yml
      - tests/town-blockout-main-summit-cable.test.ts
      - tools/verify-main-summit-cable*
      - tools/voxel-tavern/main-summit-cable-review.html
      - tools/voxel-tavern/town-blockout/main-summit-cable*.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compose the surveyed P-1 terrain fixture
        run: git restore --source=bc397d9 -- tools/voxel-tavern/town-blockout/main-summit-block.ts
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check clock, placements and measured terrain clearance
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-cable-review.ts
          node --import tsx --test --test-isolation=none tests/town-blockout-main-summit-cable.test.ts tests/town-blockout-north-ridge-cable-clock.test.ts
          mkdir -p /tmp/p2-evidence
          node --import tsx tools/verify-main-summit-cable-clearance.ts | tee /tmp/p2-evidence/clearance.json
      - name: Walk both platforms and ride in both directions
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5812 --strictPort >/tmp/p2-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5812/tools/voxel-tavern/main-summit-cable-review.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/verify-main-summit-cable.mjs /tmp/p2-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-main-summit-cable-evidence
          path: /tmp/p2-evidence
          if-no-files-found: warn
