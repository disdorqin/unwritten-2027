name: Verify flight fuel display

on:
  push:
    branches: [lane-c]
    paths:
      - '.github/workflows/verify-flight-fuel.yml'
      - 'tools/verify-flight-fuel-browser.mjs'
      - 'tools/voxel-tavern/flight-fuel-review.html'
      - 'tools/voxel-tavern/town-blockout/flight-fuel-display.*'
      - 'tests/town-blockout-flight-fuel-display.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test tests/town-blockout-flight-fuel-display.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Read all four meter states in Chromium
        run: |
          tools/voxel-tavern/node_modules/.bin/vite --config tools/voxel-tavern/vite.config.ts --host 127.0.0.1 --port 4178 --strictPort tools/voxel-tavern &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4178/flight-fuel-review.html > /dev/null
          node tools/verify-flight-fuel-browser.mjs http://127.0.0.1:4178 "${{ runner.temp }}/flight-fuel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-fuel-browser
          path: ${{ runner.temp }}/flight-fuel
