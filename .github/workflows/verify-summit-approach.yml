name: Verify summit gate approach

on:
  push:
    branches: [lane-c]
    paths:
      - '.github/workflows/verify-summit-approach.yml'
      - 'tools/verify-main-summit-approach-browser.mjs'
      - 'tools/fixtures/main-summit-approach-browser.patch'
      - 'tools/voxel-tavern/town-blockout/main-summit-approach.ts'
      - 'tests/town-blockout-main-summit-approach.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git fetch --no-tags origin 016ffb2c6fa941940fd3343251b986fe28bec649
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/verify-main-summit-approach-browser.mjs "${{ runner.temp }}/summit-approach"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summit-approach-browser
          path: ${{ runner.temp }}/summit-approach
