name: Verify window D construction

on:
  push:
    branches: [town-review-window-d-world-20261120]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build client and server and run directed tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/window-d"
          {
            git rev-parse HEAD
            npm run build
            mapfile -t directed < <(git ls-files 'tests/*orbital*.test.ts' 'tests/*forge*.test.ts' 'tests/*flight*.test.ts' 'tests/*pig-stone*.test.ts' 'tests/server/*orbital*.test.ts' 'tests/server/*forge*.test.ts')
            test "${#directed[@]}" -gt 0
            node --import tsx --test "${directed[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/window-d/contracts.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-d-contracts
          path: ${{ runner.temp }}/window-d

  browser:
    name: Walk ${{ matrix.entry }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        entry: [station, travel, status, forge, pig, flight]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Walk the rendered candidate
        shell: bash
        env:
          ENTRY: ${{ matrix.entry }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/window-d"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source.txt"
          if [ "$ENTRY" = station ]; then
            node tools/verify-orbital-station-browser.mjs "$out"
            exit
          fi
          addr=http://127.0.0.1:4173
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > "$out/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 1 --max-time 3 "$addr/" > /dev/null
          case "$ENTRY" in
            travel) S4_OUTPUT="$out" node tools/verify-orbital-travel-browser.mjs ;;
            status) node tools/verify-orbital-status-browser.mjs "$addr/tools/voxel-tavern/orbital-status-review.html" "$out" ;;
            forge) FORGE_PROOF_OUTPUT="$out" node tools/verify-warrior-forge-review.mjs ;;
            pig) node tools/verify-summit-pig-browser.mjs "$addr/tools/voxel-tavern/main-summit-pig-stone-review.html" "$out" ;;
            flight) node tools/verify-starport-flight-browser.mjs "$addr/tools/voxel-tavern/starport-flight-review.html?proof" "$out" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-d-${{ matrix.entry }}
          path: ${{ runner.temp }}/window-d
