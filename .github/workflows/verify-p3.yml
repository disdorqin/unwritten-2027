name: Verify main summit trails P-3

on:
  push:
    branches: [lane-d]
    paths:
      - .github/workflows/verify-p3.yml
      - tests/town-blockout-main-summit-trail.test.ts
      - tests/town-blockout-main-summit-sled-*.test.ts
      - tools/verify-main-summit-trail*
      - tools/verify-main-summit-snow-belt.ts
      - tools/probe-main-summit-sled-ride.ts
      - tools/fixtures/main-summit-snow-belt-survey.json
      - tools/voxel-tavern/main-summit-trails-review.html
      - tools/voxel-tavern/town-blockout/main-summit-trail*.ts
      - tools/voxel-tavern/town-blockout/main-summit-sled-*.ts
      - tools/voxel-tavern/town-blockout/main-summit-snow-*.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compose the surveyed P-1 terrain fixture
        run: git restore --source=cb47ce2 -- tools/voxel-tavern/town-blockout/main-summit-block.ts
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check survey, route geometry and sled physics
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-trails-review.ts
          node --import tsx --test --test-isolation=none tests/town-blockout-main-summit-trail.test.ts tests/town-blockout-main-summit-sled-*.test.ts
          mkdir -p /tmp/p3-evidence
          node --import tsx tools/verify-main-summit-trail-survey.ts | tee /tmp/p3-evidence/survey.json
          node --import tsx tools/verify-main-summit-snow-belt.ts | tee /tmp/p3-evidence/snow-belt.json
      - name: Walk the summit trail and time the isolated sled candidate
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5813 --strictPort >/tmp/p3-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5813/tools/voxel-tavern/main-summit-trails-review.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/verify-main-summit-trails.mjs /tmp/p3-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-main-summit-trails-evidence
          path: /tmp/p3-evidence
          if-no-files-found: warn
