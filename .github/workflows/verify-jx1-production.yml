name: Verify JX-1 production doorway candidate

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-jx1-production.yml'
      - 'docs/交流区/GPT/JX-1协作-2026-11-19/b04-production-on-2dff658.patch'
      - 'tools/jx1-formal/**'
      - 'tools/verify-b13-two-clients.mjs'
      - 'tools/b13-browser-fixture.mjs'

permissions:
  contents: read

jobs:
  doorway:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        plan: [cardinal-walk-plan, nine-home-walk-plan, six-home-walk-A-plan, six-home-walk-B-plan]
    env:
      JX1_PLAN: ${{ matrix.plan }}
      JX1_RUNTIME_COMMIT: 2dff658fd664bba873f4ad62293e1f3e1f8d1174
      JX1_PATCH_PATH: docs/交流区/GPT/JX-1协作-2026-11-19/b04-production-on-2dff658.patch
    steps:
      - name: Check out the review candidate and harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: ci

      - name: Check out the exact approved source baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.JX1_RUNTIME_COMMIT }}
          persist-credentials: false
          path: town

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install locked dependencies and Chromium
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JX1_RUNTIME_COMMIT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Record the untouched 92-door registry and apply the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jx1-formal"
          node ci/tools/jx1-formal/record-unmodified-registry.mjs town "$RUNNER_TEMP/jx1-formal/baseline.json" "$JX1_RUNTIME_COMMIT"
          (cd town && node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . snapshot) > "$RUNNER_TEMP/jx1-formal/static-baseline.json"
          git -C town apply --check --whitespace=error "../ci/$JX1_PATCH_PATH"
          git -C town apply --whitespace=error "../ci/$JX1_PATCH_PATH"
          sha256sum "ci/$JX1_PATCH_PATH" > "$RUNNER_TEMP/jx1-formal/patch-sha256.txt"

      - name: Check the market shells, interiors and original shared house
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --import tsx --test tests/town-blockout-house-portals.test.ts tests/town-blockout-shared-home.test.ts tests/town-blockout-market-entrance.test.ts tests/town-blockout-market-homes.test.ts tests/town-blockout-market-home-atlas.test.ts

      - name: Audit all 17 physical passages and 92 door-book destinations
        id: doorway-geometry
        working-directory: town
        shell: bash
        run: |
          node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . candidate "$RUNNER_TEMP/jx1-formal/static-baseline.json" --require-all --known-book-five > "$RUNNER_TEMP/jx1-formal/all-house-sweeps.json"

      - name: Verify the staged or continuous physical tour and touch input
        shell: bash
        run: |
          node ci/tools/jx1-formal/verify-jx1-production.mjs town "$RUNNER_TEMP/jx1-formal/baseline.json" "ci/tools/jx1-formal/$JX1_PLAN.json" "$RUNNER_TEMP/jx1-formal/$JX1_PLAN"

      - name: Verify actual shared-room visibility from two active market doors
        if: ${{ !cancelled() && matrix.plan == 'cardinal-walk-plan' && steps.doorway-geometry.outcome == 'success' }}
        env:
          B13_RUNTIME_COMMIT: ${{ env.JX1_RUNTIME_COMMIT }}
        shell: bash
        run: node ci/tools/verify-b13-two-clients.mjs town "$RUNNER_TEMP/jx1-formal/two-market-guests" --candidate

      - name: Upload registry, input and rendered proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jx1-formal-${{ matrix.plan }}
          path: ${{ runner.temp }}/jx1-formal
          retention-days: 14
          if-no-files-found: warn
