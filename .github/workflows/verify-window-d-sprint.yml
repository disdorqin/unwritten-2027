name: Verify window D sprint candidates

on:
  push:
    branches: [town-window-d-next-assets-20261120]
    paths:
      - .github/workflows/verify-window-d-sprint.yml
      - src/presence/**
      - src/shared/snow-wing.ts
      - src/shared/summit-passport.ts
      - tests/**
      - tools/**

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and verify the seven packages
        shell: bash
        run: |
          {
            npm run typecheck
            npx tsc --noEmit -p tsconfig.server.json
            npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler \
              tools/voxel-tavern/town-blockout/{orbital-cabin,underground-crystal-cave,underground-warrior-city,underground-palace}-review.ts
            node --import tsx --test tests/town-blockout-underground-{crystal-cave,warrior-city,palace-shell}.test.ts \
              tests/town-blockout-orbital-{observation,living-cabin}.test.ts tests/town-blockout-snow-wing.test.ts \
              tests/server/{presence,presence-polling,summit-passport}.test.ts
          } 2>&1 | tee "$RUNNER_TEMP/window-d-contracts.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-d-contracts
          path: ${{ runner.temp }}/window-d-contracts.txt
  walkthrough:
    strategy:
      fail-fast: false
      matrix:
        package: [U-9, U-10, U-11, S-6-and-S-7]
    name: Walkthrough ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture first-person walkthrough
        shell: bash
        env:
          VERIFY_PACKAGE: ${{ matrix.package }}
          OUTPUT_DIR: ${{ runner.temp }}/walkthrough
        run: |
          case "$VERIFY_PACKAGE" in
            U-9)
              (cd tools/voxel-tavern && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort) &
              vite_pid=$!
              trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
              export U9_URL=http://127.0.0.1:4173/town-crystal-cave-review.html
              export U9_OUTPUT="$OUTPUT_DIR"
              for attempt in $(seq 1 25); do
                curl --silent --fail "$U9_URL" >/dev/null && break
                sleep 1
              done
              curl --silent --fail "$U9_URL" >/dev/null
              timeout --signal=TERM --kill-after=10s 570s node --import tsx tools/verify-underground-crystal-cave.mjs
              ;;
            U-10) timeout --signal=TERM --kill-after=10s 300s node tools/verify-warrior-city-browser.mjs . "$OUTPUT_DIR" ;;
            U-11) timeout --signal=TERM --kill-after=10s 300s node tools/verify-underground-palace-browser.mjs "$OUTPUT_DIR" ;;
            S-6-and-S-7) timeout --signal=TERM --kill-after=10s 180s node tools/verify-orbital-cabin-browser.mjs "$OUTPUT_DIR" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-d-walkthrough-${{ matrix.package }}
          path: ${{ runner.temp }}/walkthrough
          if-no-files-found: warn
