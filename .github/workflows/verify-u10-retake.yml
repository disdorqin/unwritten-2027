name: Capture the descent gate and collapsed wall in context

on:
  push:
    branches: [town-review-windowd-extension-20261120]
    paths:
      - .github/workflows/verify-u10-retake.yml
      - tools/verify-warrior-city-browser.mjs

permissions:
  contents: read

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Walk the street and frame both endpoints
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 285s node tools/verify-warrior-city-browser.mjs . "$RUNNER_TEMP/warrior-city-retake"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warrior-city-endpoint-retake
          path: ${{ runner.temp }}/warrior-city-retake
