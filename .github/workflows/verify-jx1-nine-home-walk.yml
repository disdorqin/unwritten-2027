name: Verify JX-1 nine homes in one keyboard session

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-jx1-nine-home-walk.yml'
      - 'tools/jx1-nine/**'

permissions:
  contents: read

jobs:
  nine-home-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      JX1_RUNTIME_COMMIT: 2dff658fd664bba873f4ad62293e1f3e1f8d1174
      JX1_B04_PATCH: docs/交流区/GPT/JX-1协作-2026-11-19/b04-production-on-2dff658.patch
      JX1_STALL_PATCH: tools/jx1-stall5/stall-five-south.patch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: ci

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.JX1_RUNTIME_COMMIT }}
          persist-credentials: false
          path: town

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install the pinned browser and runtime dependencies
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JX1_RUNTIME_COMMIT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Record the original 92 destinations and build the reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/jx1-nine"
          mkdir -p "$proof"
          sha256sum "ci/$JX1_B04_PATCH" "ci/$JX1_STALL_PATCH" \
            ci/tools/jx1-nine/continuous-walk.patch \
            ci/tools/jx1-formal/nine-home-walk-plan.json > "$proof/patch-and-plan-sha256.txt"
          node ci/tools/jx1-formal/record-unmodified-registry.mjs town "$proof/baseline.json" "$JX1_RUNTIME_COMMIT"
          (cd town && node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . snapshot) > "$proof/static-baseline.json"
          git -C town apply --check --whitespace=error "../ci/$JX1_B04_PATCH" "../ci/$JX1_STALL_PATCH"
          git -C town apply --whitespace=error "../ci/$JX1_B04_PATCH" "../ci/$JX1_STALL_PATCH"
          git -C ci apply --check --whitespace=error tools/jx1-nine/continuous-walk.patch
          git -C ci apply --whitespace=error tools/jx1-nine/continuous-walk.patch
          (cd town && node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . candidate \
            "$proof/static-baseline.json" --require-all --known-book-five) > "$proof/all-house-sweeps.json"

      - name: Walk from the street through all nine original doors and back in one session
        timeout-minutes: 225
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/jx1-nine"
          node ci/tools/jx1-formal/verify-jx1-production.mjs town "$proof/baseline.json" \
            ci/tools/jx1-formal/nine-home-walk-plan.json "$proof/walk" --continuous-only

      - name: Archive the complete route or its last verified return to the street
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jx1-nine-homes-one-keyboard-session
          path: ${{ runner.temp }}/jx1-nine
          retention-days: 14
          if-no-files-found: warn
