name: Verify flight equipment assets

on:
  push:
    branches: [lane-c]
    paths:
      - '.github/workflows/verify-flight-equipment.yml'
      - 'tools/verify-flight-equipment-visuals.mjs'
      - 'tools/voxel-tavern/town-blockout/flight-equipment*.ts'
      - 'tests/town-blockout-flight-equipment-visuals.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test tests/town-blockout-flight-equipment-visuals.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node tools/verify-flight-equipment-visuals.mjs "${{ runner.temp }}/flight-equipment"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-equipment-browser
          path: ${{ runner.temp }}/flight-equipment
