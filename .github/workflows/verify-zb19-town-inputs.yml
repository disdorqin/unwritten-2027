name: Verify ZB-19 unified inputs in the little town

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-zb19-town-inputs.yml'
      - 'tools/verify-zb19-town-inputs.mjs'

permissions:
  contents: read

jobs:
  town-desktop-and-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOWN_RUNTIME_COMMIT: b610f75ef0234b51061b621a4693d12e363c06ca
      B_INPUT_COMMIT: 34faee8115e3e372712976e3cf64d129f5a728c0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: proof
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TOWN_RUNTIME_COMMIT }}
          persist-credentials: false
          path: town
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.B_INPUT_COMMIT }}
          persist-credentials: false
          path: handoff
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assemble the pinned A and B candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C town rev-parse HEAD)" = "$TOWN_RUNTIME_COMMIT"
          test "$(git -C handoff rev-parse HEAD)" = "$B_INPUT_COMMIT"
          out="$RUNNER_TEMP/zb19-town-inputs"
          mkdir -p "$out"
          public="../handoff/docs/交流区/GPT/窗B公共批-2026-11-20"
          for patch in zb15-wall-rules-on-9dd569b.patch zb15-server-on-9dd569b.patch \
            zb16-sled-state-on-9dd569b.patch zb19-sled-brake-leaf-on-9dd569b.patch zb19-za02-mount-on-b610f75.patch; do
            git -C town apply --check --whitespace=error "$public/$patch"
            git -C town apply --whitespace=error "$public/$patch"
          done
          for file in src/shared/snow-stock.ts tools/voxel-tavern/town-blockout/{town-snowball,plaza-snow-supply,town-snow-controls,town-mobile-controls}.ts \
            tools/voxel-tavern/town-blockout/town-mobile-controls.css; do
            cp "handoff/$file" "town/$file"
          done
          printf 'A %s\nB %s\n' "$TOWN_RUNTIME_COMMIT" "$B_INPUT_COMMIT" > "$out/commits.txt"
      - name: Install exact runtime dependencies and Chromium
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise shared interaction, snow, and driving in the composed town
        shell: bash
        env:
          ZB19_LOOPBACK_HELPER: ${{ github.workspace }}/handoff/tools/jx1-formal/app-build-and-loopback.mjs
        run: node proof/tools/verify-zb19-town-inputs.mjs town "$RUNNER_TEMP/zb19-town-inputs"
      - name: Archive the mounted candidate and input traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zb19-town-inputs
          path: ${{ runner.temp }}/zb19-town-inputs
          retention-days: 14
          if-no-files-found: warn
