name: Verify ZB-16 sled turnover and remount

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-zb16-town-sled.yml'
      - 'tools/verify-zb16-town-sled.mjs'

permissions:
  contents: read

jobs:
  town-sled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOWN_RUNTIME_COMMIT: 9dd569b73cea04fb3bf99645c6976420d30c4752
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: proof
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TOWN_RUNTIME_COMMIT }}
          persist-credentials: false
          path: town
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assemble the surveyed release candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C town rev-parse HEAD)" = "$TOWN_RUNTIME_COMMIT"
          for file in src/shared/snow-stock.ts tools/voxel-tavern/town-blockout/{town-snowball,plaza-snow-supply,town-snow-controls}.ts; do
            cp "proof/$file" "town/$file"
          done
          public="../proof/docs/交流区/GPT/窗B公共批-2026-11-20"
          git -C town apply --check --whitespace=error "$public"/zb15-{wall-rules,server,controls}-on-9dd569b.patch
          git -C town apply --whitespace=error "$public"/zb15-{wall-rules,server,controls}-on-9dd569b.patch
          for patch in sled-state sled-input; do
            git -C town apply --check --whitespace=error "$public/zb16-$patch-on-9dd569b.patch"
            git -C town apply --whitespace=error "$public/zb16-$patch-on-9dd569b.patch"
          done
      - name: Install exact runtime dependencies and Chromium
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Ride, recover, and remount in the built town
        shell: bash
        env:
          ZB16_LOOPBACK_HELPER: ${{ github.workspace }}/proof/tools/jx1-formal/app-build-and-loopback.mjs
        run: node proof/tools/verify-zb16-town-sled.mjs town "$RUNNER_TEMP/zb16-town-sled"
      - name: Archive the live candidate and input traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zb16-town-sled
          path: ${{ runner.temp }}/zb16-town-sled/zb16-town-sled.json
          retention-days: 14
          if-no-files-found: warn
