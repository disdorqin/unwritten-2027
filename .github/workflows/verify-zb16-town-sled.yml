name: Verify ZB-16 sled turnover and remount

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-zb16-town-sled.yml'
      - 'tools/verify-zb16-town-sled.mjs'
      - 'docs/交流区/GPT/窗B公共批-2026-11-20/zb16-sled-safe-support-after-zb19-brake-on-9dd569b.patch'
      - 'docs/交流区/GPT/窗B公共批-2026-11-20/zb16-ceremony-sled-za02-after-unified-on-1da54e9.patch'

permissions:
  contents: read

jobs:
  town-sled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOWN_RUNTIME_COMMIT: 1da54e9ea448f772457153a37bdd0a3d3e27d54f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: proof
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TOWN_RUNTIME_COMMIT }}
          persist-credentials: false
          path: town
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assemble the unified controls on the pinned integration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C town rev-parse HEAD)" = "$TOWN_RUNTIME_COMMIT"
          public="../proof/docs/交流区/GPT/窗B公共批-2026-11-20"
          for patch in zb15-wall-rules-on-9dd569b.patch zb15-server-on-9dd569b.patch \
            zb16-sled-state-on-9dd569b.patch zb19-sled-brake-leaf-on-9dd569b.patch \
            zb19-za02-mount-on-b610f75.patch zb19-za02-brake-cancel-after-mount.patch \
            za02-ceremony-frost-png-on-970b3ed.patch zb16-sled-safe-support-after-zb19-brake-on-9dd569b.patch \
            zb16-ceremony-sled-za02-after-unified-on-1da54e9.patch; do
            git -C town apply --check --whitespace=error "$public/$patch"
            git -C town apply --whitespace=error "$public/$patch"
          done
          for file in src/shared/snow-stock.ts tools/voxel-tavern/town-blockout/{town-snowball,plaza-snow-supply,town-snow-controls,town-mobile-controls}.ts \
            tools/voxel-tavern/town-blockout/town-mobile-controls.css; do
            cp "proof/$file" "town/$file"
          done
      - name: Install exact runtime dependencies and Chromium
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the composed sled regressions
        working-directory: town
        run: node --import tsx --test tests/town-blockout-sled*.test.ts
      - name: Ride, recover, and remount in the built town
        shell: bash
        env:
          ZB16_LOOPBACK_HELPER: ${{ github.workspace }}/proof/tools/jx1-formal/app-build-and-loopback.mjs
        run: node proof/tools/verify-zb16-town-sled.mjs town "$RUNNER_TEMP/zb16-town-sled" --airborne-exit
      - name: Archive the live candidate and input traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zb16-town-sled
          path: ${{ runner.temp }}/zb16-town-sled/zb16-town-sled.json
          retention-days: 14
          if-no-files-found: warn
