name: Verify native F-1 landing and ground walking

on:
  push:
    branches: [town-verify-f1-postland-20261120]

permissions:
  contents: read

jobs:
  flight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      F1_SOURCE: ec1bf9def94835abc9b279f390051743b9879ec8
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.F1_SOURCE }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and select Chromium
        id: install
        run: |
          test "$(git rev-parse HEAD)" = "$F1_SOURCE"
          mkdir -p "$RUNNER_TEMP/f1-postland"
          git rev-parse HEAD > "$RUNNER_TEMP/f1-postland/source-commit.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          if browser="$(command -v google-chrome-stable || command -v google-chrome)"; then
            printf 'CHROMIUM_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify flight mechanics, rings, rack and preview types
        run: |
          node --import tsx --test tests/town-blockout-snow-wing.test.ts tests/town-blockout-main-summit-glide-rings.test.ts tests/town-blockout-main-summit-wing-rack.test.ts
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-snow-wing-review.ts
      - name: Register, fly, land and walk with native keyboard input
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: >-
          timeout --signal=TERM --kill-after=10s 245s
          node tools/verify-snow-wing-browser.mjs . "$RUNNER_TEMP/f1-postland"
      - name: Hash native screenshots and readings
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/f1-postland"
          cd "$RUNNER_TEMP/f1-postland"
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*.json' -o -name source-commit.txt \) -print0 |
            sort -z | xargs -0 --no-run-if-empty sha256sum > captures.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-native-postland-ec1bf9de
          path: |
            ${{ runner.temp }}/f1-postland/*.png
            ${{ runner.temp }}/f1-postland/*.json
            ${{ runner.temp }}/f1-postland/source-commit.txt
            ${{ runner.temp }}/f1-postland/captures.sha256
