name: Verify climbing, mine inhabitants and orbital cabin signs

on:
  push:
    branches: [town-review-windowd-extension-20261120]
    paths:
      - .github/workflows/verify-windowd-extension.yml
      - src/shared/mine-bestiary.ts
      - tests/**
      - tools/voxel-tavern/**
      - tools/verify-north-ridge-climb.mjs
      - tools/verify-orbital-signage-browser.mjs

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - name: Run habitat, action and placement tests
        shell: bash
        run: |
          {
            git rev-parse HEAD
            git hash-object tools/voxel-tavern/town-blockout/{north-ridge-350-terrain,orbital-early-rooms,orbital-airlock-nameplate,town-chronicle-door-ring}.ts
            test "$(git hash-object tools/voxel-tavern/town-blockout/north-ridge-350-terrain.ts)" = a98e2dbef612f2c94ca813d01a0c5ac6bb7e6ae6
            npm run typecheck
            npx tsc --noEmit -p tsconfig.server.json
            npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler \
              tools/voxel-tavern/town-blockout/{north-ridge-climb,orbital-cabin-signage}-review.ts
            node --import tsx --test tests/town-blockout-{mine-bestiary,north-ridge-climb,orbital-cabin-signage}.test.ts
          } 2>&1 | tee "$RUNNER_TEMP/extension-contracts.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-contracts
          path: ${{ runner.temp }}/extension-contracts.txt
  browser:
    strategy:
      fail-fast: false
      matrix:
        package: [P-14, S-11]
    name: Review ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture the rock wall or cabin signs
        shell: bash
        env:
          REVIEW_PACKAGE: ${{ matrix.package }}
          OUTPUT: ${{ runner.temp }}/extension-evidence
        run: |
          if [ "$REVIEW_PACKAGE" = P-14 ]; then
            node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort &
            vite_pid=$!
            trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
            export P14_URL=http://127.0.0.1:4173/tools/voxel-tavern/town-north-ridge-climb-review.html
            export P14_OUTPUT="$OUTPUT"
            for attempt in $(seq 1 25); do
              curl --silent --fail "$P14_URL" >/dev/null && break
              sleep 1
            done
            curl --silent --fail "$P14_URL" >/dev/null
            timeout --signal=TERM --kill-after=10s 570s node tools/verify-north-ridge-climb.mjs
          else
            timeout --signal=TERM --kill-after=10s 120s node tools/verify-orbital-signage-browser.mjs "$OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-${{ matrix.package }}
          path: ${{ runner.temp }}/extension-evidence
          if-no-files-found: warn
