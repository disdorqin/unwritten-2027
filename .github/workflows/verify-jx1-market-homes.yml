name: Verify JX-1 market homes

on:
  push:
    branches: [lane-build]
    paths:
      - 'docs/交流区/GPT/JX-1-集市17户.patch'
      - '.github/workflows/verify-jx1-market-homes.yml'
      - 'tools/verify-jx1-market-homes.mjs'
      - 'tools/compare-market-homes.mjs'
      - 'tools/paired-review.html'
      - 'docs/交流区/GPT/JX-1协作-2026-11-19/market-home-material-atlas.patch'
      - 'docs/交流区/GPT/JX-1协作-2026-11-19/market-home-atlas-surface-refinement.patch'

permissions:
  contents: read

concurrency:
  group: jx1-market-homes-proof
  cancel-in-progress: false

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JX_BASELINE_SHA: 352aa49b825d88c432ef2dd0a9dd04a5c86441c3
      JX_CANDIDATE_SHA: ${{ github.sha }}
      JX_PATCH_PATH: docs/交流区/GPT/JX-1-集市17户.patch
      JX_ATLAS_PATH: docs/交流区/GPT/JX-1协作-2026-11-19/market-home-material-atlas.patch
      JX_SURFACE_PATH: docs/交流区/GPT/JX-1协作-2026-11-19/market-home-atlas-surface-refinement.patch
      JX_URL: http://127.0.0.1:4329/tools/voxel-tavern/jx1-market-homes.html
    steps:
      - name: Check out the published candidate receipt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: ci

      - name: Check out the integration baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.JX_BASELINE_SHA }}
          persist-credentials: false
          path: town

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Apply the exact candidate patch
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          JX_OUTPUT="$RUNNER_TEMP/jx1-proof"
          mkdir -p "$JX_OUTPUT"
          printf 'JX_OUTPUT=%s\n' "$JX_OUTPUT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$JX_BASELINE_SHA"
          test "$(git -C ../ci rev-parse HEAD)" = "$JX_CANDIDATE_SHA"
          git -C ../ci show "$JX_CANDIDATE_SHA:$JX_PATCH_PATH" > "$RUNNER_TEMP/jx1.patch"
          sha256sum "$RUNNER_TEMP/jx1.patch" | tee "$JX_OUTPUT/patch-sha256.txt"
          git apply --check --whitespace=error "$RUNNER_TEMP/jx1.patch"
          git apply --whitespace=error "$RUNNER_TEMP/jx1.patch"
          JX_BARE="$RUNNER_TEMP/jx1-bare"
          mkdir -p "$JX_BARE/tools" "$JX_BARE/docs"
          cp -a package.json src "$JX_BARE/"
          cp -a tools/voxel-tavern "$JX_BARE/tools/"
          cp docs/p0-layout-draft.json "$JX_BARE/docs/"
          printf 'JX_BARE=%s\n' "$JX_BARE" >> "$GITHUB_ENV"
          git -C ../ci show "$JX_CANDIDATE_SHA:$JX_ATLAS_PATH" > "$RUNNER_TEMP/jx1-atlas.patch"
          sha256sum "$RUNNER_TEMP/jx1-atlas.patch" | tee "$JX_OUTPUT/atlas-sha256.txt"
          git apply --check --whitespace=error "$RUNNER_TEMP/jx1-atlas.patch"
          git apply --whitespace=error "$RUNNER_TEMP/jx1-atlas.patch"
          git -C ../ci show "$JX_CANDIDATE_SHA:$JX_SURFACE_PATH" > "$RUNNER_TEMP/jx1-atlas-surface.patch"
          sha256sum "$RUNNER_TEMP/jx1-atlas-surface.patch" | tee "$JX_OUTPUT/atlas-surface-sha256.txt"
          git apply --check --whitespace=error "$RUNNER_TEMP/jx1-atlas-surface.patch"
          git apply --whitespace=error "$RUNNER_TEMP/jx1-atlas-surface.patch"
          git status --short | tee "$JX_OUTPUT/changed-files.txt"

      - name: Install locked dependencies and Chromium
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify the market candidate and the original door book
        id: candidate-tests
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --import tsx --test tests/town-blockout-market-homes.test.ts tests/town-blockout-market-home-atlas.test.ts tests/town-blockout-house-portals.test.ts

      - name: Capture rendered homes and replay their inspected paths
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4329 --strictPort > "$JX_OUTPUT/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 "$JX_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 "$JX_URL" >/dev/null
          node ../ci/tools/verify-jx1-market-homes.mjs

      - name: Compare the same cameras before and after the material atlas
        if: ${{ !cancelled() && steps.candidate-tests.outcome == 'success' }}
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$PWD/node_modules" "$JX_BARE/node_modules"
          ln -s "$PWD/tools/voxel-tavern/node_modules" "$JX_BARE/tools/voxel-tavern/node_modules"
          node ../ci/tools/compare-market-homes.mjs "$JX_BARE" "$PWD" "$JX_OUTPUT/paired"

      - name: Upload the proof bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jx1-market-homes-proof
          path: ${{ runner.temp }}/jx1-proof
          retention-days: 14
          if-no-files-found: warn
