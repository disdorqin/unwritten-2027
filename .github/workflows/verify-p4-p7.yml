name: Verify main summit facilities P-4 and P-7

on:
  push:
    branches: [lane-d]
    paths:
      - .github/workflows/verify-p4-p7.yml
      - tests/town-blockout-main-summit-registration.test.ts
      - tests/town-blockout-main-summit-cable-stations.test.ts
      - tools/verify-main-summit-p4.mjs
      - tools/verify-main-summit-p7.mjs
      - tools/voxel-tavern/main-summit-p4-review.html
      - tools/voxel-tavern/main-summit-cable-stations-review.html
      - tools/voxel-tavern/town-blockout/main-summit-registration.ts
      - tools/voxel-tavern/town-blockout/main-summit-p4-review.ts
      - tools/voxel-tavern/town-blockout/main-summit-cable-stations*.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compose the audited P-1 terrain
        run: git restore --source=cb47ce2 -- tools/voxel-tavern/town-blockout/main-summit-block.ts
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Typecheck and verify registration and station clearance
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-p4-review.ts tools/voxel-tavern/town-blockout/main-summit-cable-stations-review.ts
          node --import tsx --test --test-isolation=none tests/town-blockout-main-summit-registration.test.ts tests/town-blockout-main-summit-cable-stations.test.ts
      - name: Prove the P-4 registration and P-7 station routes in Chromium
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5814 --strictPort >/tmp/p4-p7-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5814/tools/voxel-tavern/main-summit-p4-review.html >/dev/null; then break; fi
            sleep 1
          done
          set +e
          node tools/verify-main-summit-p4.mjs /tmp/p4-p7-evidence/p4
          p4_status=$?
          node tools/verify-main-summit-p7.mjs /tmp/p4-p7-evidence/p7
          p7_status=$?
          exit $((p4_status || p7_status))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-p7-main-summit-facilities
          path: /tmp/p4-p7-evidence
          if-no-files-found: warn
