name: Verify main summit P-1

on:
  push:
    branches: [lane-c]
    paths:
      - .github/workflows/verify-p1.yml
      - tests/town-blockout-main-summit.test.ts
      - tools/verify-main-summit-browser.mjs
      - tools/voxel-tavern/main-summit-review.html
      - tools/voxel-tavern/town-blockout/main-summit-*.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Typecheck and test the summit and front ridge
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-review.ts
          node --import tsx --test tests/town-blockout-main-summit.test.ts tests/town-blockout-north-ridge-350.test.ts
      - name: Walk the gate and capture the four summit views
        timeout-minutes: 4
        run: node tools/verify-main-summit-browser.mjs . /tmp/p1-evidence
      - name: Upload summit and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-main-summit-evidence
          path: /tmp/p1-evidence
          if-no-files-found: warn
