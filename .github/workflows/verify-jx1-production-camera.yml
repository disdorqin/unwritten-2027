name: Verify JX-1 production fixed-camera scenes

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-jx1-production-camera.yml'
      - 'docs/交流区/GPT/JX-1协作-2026-11-19/b04-production-on-2dff658.patch'
      - 'tools/jx1-camera/**'

permissions:
  contents: read

jobs:
  render-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JX1_FROZEN: 75859a094757c5dcee8b874eef86ec37f4204907
      JX1_PATCH: docs/交流区/GPT/JX-1协作-2026-11-19/b04-production-on-2dff658.patch
    steps:
      - name: Check out the exact candidate receipt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: ci

      - name: Check out the released source reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.JX1_FROZEN }}
          persist-credentials: false
          path: town

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Prepare the two exact source trees and Chromium
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JX1_FROZEN"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          JX1_REFERENCE="$RUNNER_TEMP/jx1-reference"
          git worktree add --detach "$JX1_REFERENCE" "$JX1_FROZEN"
          ln -s "$PWD/node_modules" "$JX1_REFERENCE/node_modules"
          ln -s "$PWD/tools/voxel-tavern/node_modules" "$JX1_REFERENCE/tools/voxel-tavern/node_modules"
          git apply --check --whitespace=error "../ci/$JX1_PATCH"
          git apply --whitespace=error "../ci/$JX1_PATCH"
          printf 'JX1_REFERENCE=%s\n' "$JX1_REFERENCE" >> "$GITHUB_ENV"

      - name: Capture the same production cameras and all candidate interiors
        shell: bash
        run: |
          node ci/tools/jx1-camera/capture-town.mjs "$JX1_REFERENCE" town "$RUNNER_TEMP/jx1-camera"

      - name: Upload captured frames and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jx1-production-camera-proof
          path: ${{ runner.temp }}/jx1-camera
          retention-days: 14
          if-no-files-found: warn
