name: Verify the S-1 Q1 candidate door rings

on:
  push:
    branches: [town-review-s1-q1-20261120]
    paths:
      - '.github/workflows/verify-s1-q1-browser.yml'
      - 'tools/verify-s1-q1-perspective.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      EXPANSION_BASELINE_SHA: 76d52afe424a7bdb8b54123187dd853e33f72a47
      EXPANSION_URL: http://127.0.0.1:4331/tools/voxel-tavern/town-expansion-review.html
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 76d52afe424a7bdb8b54123187dd853e33f72a47
          path: fixture
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the archived patch and install locked dependencies
        working-directory: fixture
        shell: bash
        run: |
          set -euo pipefail
          EXPANSION_OUTPUT="$RUNNER_TEMP/s1-q1-proof"
          printf 'EXPANSION_OUTPUT=%s\n' "$EXPANSION_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$EXPANSION_OUTPUT"
          s1_patch="$GITHUB_WORKSPACE/docs/交流区/GPT/B01续段候选/s1-authority-and-ring.patch"
          printf '%s  %s\n' ccdbf842f67b6a6c2c82691f2e2e719bb69e31aeb9c9c8e6737c8090cf5fd9ca "$s1_patch" | sha256sum -c
          git apply --check --whitespace=error "$s1_patch"
          git apply --whitespace=error "$s1_patch"
          git add --all
          fixture_tree=$(git write-tree)
          printf 'EXPANSION_CANDIDATE_SHA=%s\n' "$fixture_tree" >> "$GITHUB_ENV"
          printf 'base=%s\ntree=%s\npatch=%s\n' "$(git rev-parse HEAD)" "$fixture_tree" \
            ccdbf842f67b6a6c2c82691f2e2e719bb69e31aeb9c9c8e6737c8090cf5fd9ca > "$EXPANSION_OUTPUT/source.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          node --import tsx --test tests/server/{orbital-gates,orbital-anchor-registry}.test.ts tests/town-blockout-orbital-early-rooms.test.ts | tee "$EXPANSION_OUTPUT/targeted-tests.txt"
          npx playwright install --with-deps chromium
      - name: Capture the candidate in Chromium
        working-directory: fixture
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4331 --strictPort > "$EXPANSION_OUTPUT/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 "$EXPANSION_URL" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 "$EXPANSION_URL" > /dev/null
          node tools/verify-expansion-review.mjs
          node "$GITHUB_WORKSPACE/tools/verify-s1-q1-perspective.mjs"
      - name: Upload browser originals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s1-q1-candidate-proof
          path: ${{ runner.temp }}/s1-q1-proof
          if-no-files-found: error
