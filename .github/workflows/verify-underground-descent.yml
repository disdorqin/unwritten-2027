name: Verify the underground descent

on:
  push:
    branches: [lane-c]
    paths:
      - '.github/workflows/verify-underground-descent.yml'
      - 'src/presence/underground-lift-*.ts'
      - 'src/presence/underground-mine-lift.ts'
      - 'src/shared/underground-descent*.ts'
      - 'tools/voxel-tavern/town-blockout/underground-descent*.ts'
      - 'tools/voxel-tavern/town-blockout/underground-lift-cinematic*.ts'
      - 'tools/fixtures/underground-descent-review.ts'
      - 'tools/verify-underground-descent.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Mount the original entry authority and mine in the verifier
        shell: bash
        run: |
          set -euo pipefail
          base=1da54e9ea448f772457153a37bdd0a3d3e27d54f
          git fetch --no-tags origin "$base"
          entry=src/presence/underground-entry.ts
          mine=tools/voxel-tavern/town-blockout/underground-mine-layout.ts
          for file in "$entry" "$mine"; do
            if [ ! -f "$file" ]; then
              git show "$base:$file" > "$file"
            fi
          done
          test "$(git hash-object "$entry")" = bcc0b59110f46d3ecd109bd457027e555783b355
          test "$(git hash-object "$mine")" = 1f1ab0da6785b1df3ab3112870940f5b7f3a6921
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: node tools/verify-underground-descent.mjs "${{ runner.temp }}/underground-descent"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: underground-descent-browser
          path: ${{ runner.temp }}/underground-descent
