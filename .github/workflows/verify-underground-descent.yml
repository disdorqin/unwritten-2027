name: Verify the underground descent

on:
  push:
    branches: [lane-c]
    paths:
      - '.github/workflows/verify-underground-descent.yml'
      - 'src/presence/underground-entry*.ts'
      - 'tests/server/underground-entry*.test.ts'
      - 'src/presence/underground-lift-*.ts'
      - 'src/presence/underground-mine-gate.ts'
      - 'src/presence/underground-mine-lift.ts'
      - 'src/presence/underground-winch.ts'
      - 'src/shared/underground-descent*.ts'
      - 'tools/voxel-tavern/town-blockout/underground-descent*.ts'
      - 'tools/voxel-tavern/town-blockout/underground-lift-*.ts'
      - 'tools/voxel-tavern/town-blockout/underground-mine-layout.ts'
      - 'tools/voxel-tavern/town-blockout/underground-mine-expansion-shell.ts'
      - 'tools/fixtures/underground-descent-review.ts'
      - 'tools/verify-underground-descent.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check the entry authority and current mine layout
        shell: bash
        run: |
          set -euo pipefail
          entry=src/presence/underground-entry.ts
          mine=tools/voxel-tavern/town-blockout/underground-mine-layout.ts
          test -f "$entry"
          test -f "$mine"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --import tsx --test tests/server/underground-entry*.test.ts tests/server/underground-lift-domain-handoff.test.ts tests/server/underground-mine-lift.test.ts tests/server/underground-winch.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node tools/verify-underground-descent.mjs "${{ runner.temp }}/underground-descent"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: underground-descent-browser
          path: ${{ runner.temp }}/underground-descent
