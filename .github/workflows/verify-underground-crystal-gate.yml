name: Verify the underground crystal gate

on:
  push:
    branches: [lane-c]
    paths:
      - '.github/workflows/verify-underground-crystal-gate.yml'
      - 'src/presence/underground-mine-gate.ts'
      - 'src/presence/underground-mine-reach.ts'
      - 'tests/town-blockout-underground-mine-reach.test.ts'
      - 'src/presence/underground-winch.ts'
      - 'tools/voxel-tavern/town-blockout/underground-crystal-gate.ts'
      - 'tools/voxel-tavern/town-blockout/underground-mine-layout.ts'
      - 'tools/voxel-tavern/town-blockout/underground-mine-expansion-shell.ts'
      - 'src/shared/underground-mine-layout.ts'
      - 'src/shared/underground-mine-expansion-shell.ts'
      - 'tools/fixtures/underground-crystal-gate-review.ts'
      - 'tools/verify-underground-crystal-gate.mjs'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --import tsx --test tests/town-blockout-underground-mine-reach.test.ts
      - name: Load the mine reach module without browser dependencies
        shell: bash
        run: |
          build="$RUNNER_TEMP/mine-presence"
          npm exec -- tsc --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --rootDir src --outDir "$build" src/presence/underground-mine-reach.ts src/shared/underground-mine-layout.ts
          node --input-type=module -e 'import { pathToFileURL } from "node:url"; for (const path of process.argv.slice(1)) await import(pathToFileURL(path).href);' "$build/presence/underground-mine-reach.js" "$build/shared/underground-mine-layout.js"
      - name: Verify in Chromium
        shell: bash
        run: |
          if browser="$(command -v google-chrome-stable || command -v google-chrome)"; then
            export UNWRITTEN_CHROMIUM_EXECUTABLE="$browser"
          else
            npx playwright install --with-deps chromium
          fi
          node tools/verify-underground-crystal-gate.mjs "${{ runner.temp }}/crystal-gate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: underground-crystal-gate-browser
          path: ${{ runner.temp }}/crystal-gate
