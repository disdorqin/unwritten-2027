name: Verify mounted summit assembly P-1

on:
  push:
    branches: [town-freeze-p1-assembly-20261120]
    paths:
      - .github/workflows/verify-p1-assembly.yml
      - tools/verify-main-summit-browser.mjs
      - tools/voxel-tavern/main-summit-review.html
      - tools/voxel-tavern/town-blockout.html
      - tools/voxel-tavern/town-blockout/main-summit-*.ts
      - tools/voxel-tavern/town-blockout/viewer.ts
      - tests/town-blockout-main-summit*.test.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and Chromium
        id: install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check types and summit contracts
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --resolveJsonModule --esModuleInterop --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-review.ts
          node --import tsx --test tests/town-blockout-main-summit*.test.ts tests/town-blockout-north-ridge-350.test.ts
      - name: Walk through the assembled gate and return on foot
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=6s 285s node tools/verify-main-summit-browser.mjs . /tmp/p1-assembly-evidence
      - name: Observe the peak from the normal town viewer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=6s 285s node --import tsx tools/verify-main-summit-browser.mjs . /tmp/p1-town-evidence --town
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-mounted-summit-evidence
          path: |
            /tmp/p1-assembly-evidence
            /tmp/p1-town-evidence
          if-no-files-found: warn
