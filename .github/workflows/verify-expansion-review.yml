name: Verify the underground and orbital review

on:
  push:
    branches: [lane-build]
    paths:
      - .github/workflows/verify-expansion-review.yml
      - tools/verify-expansion-review.mjs
      - tools/voxel-tavern/town-expansion-review.html
      - tools/voxel-tavern/town-blockout/town-expansion-review*.ts
      - tools/voxel-tavern/town-blockout/orbital-early-rooms.ts
      - tests/town-blockout-orbital-early-rooms.test.ts
      - tests/town-blockout-expansion-review.test.ts

permissions:
  contents: read

jobs:
  chromium-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPANSION_BASELINE_SHA: 2966d9f05329084b8fb9072f997f5da6e7a4586a
      EXPANSION_CANDIDATE_SHA: ${{ github.sha }}
      EXPANSION_URL: http://127.0.0.1:4331/tools/voxel-tavern/town-expansion-review.html
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Run the targeted fixture regression
        shell: bash
        run: |
          set -euo pipefail
          EXPANSION_OUTPUT="$RUNNER_TEMP/expansion-proof"
          mkdir -p "$EXPANSION_OUTPUT"
          printf 'EXPANSION_OUTPUT=%s\n' "$EXPANSION_OUTPUT" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
          node --import tsx --test tests/town-blockout-{meteor-crater,underground-mine-layout,orbital-early-rooms,expansion-review}.test.ts tests/server/{underground-entry,orbital-gates}.test.ts | tee "$EXPANSION_OUTPUT/targeted-tests.txt"
          npx playwright install --with-deps chromium

      - name: Open Chromium and exercise the two preview routes
        shell: bash
        run: |
          set -euo pipefail
          VITE_PORT=4331
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port "$VITE_PORT" --strictPort > "$EXPANSION_OUTPUT/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 "$EXPANSION_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 "$EXPANSION_URL" >/dev/null
          node tools/verify-expansion-review.mjs

      - name: Upload the proof bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion-review-proof
          path: ${{ runner.temp }}/expansion-proof
          retention-days: 14
          if-no-files-found: warn
