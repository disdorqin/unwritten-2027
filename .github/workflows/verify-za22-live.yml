name: Verify ZD-03 mounted rack from the production spawn

on:
  push:
    branches:
      - town-verify-zd03-current-rack-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      ZD03_PRODUCTION_PIN: 776cb7f6ee743bd21c4317bf031a58f049e16f1c
      # Preserve the normal HUD layout and default quality at a smaller headless raster.
      ZA22_DEVICE_SCALE: 0.25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verified browser tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if browser="$(command -v google-chrome-stable || command -v google-chrome)"; then
            echo "UNWRITTEN_CHROMIUM_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Build production Web and Presence
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/za22-live"
          mkdir -p "$out"
          git rev-parse HEAD | tee "$out/source-commit.txt"
          git rev-parse HEAD^{tree} | tee "$out/source-tree.txt"
          git rev-parse "$ZD03_PRODUCTION_PIN" | tee "$out/production-pin.txt"
          git diff --exit-code "$ZD03_PRODUCTION_PIN" HEAD -- . \
            ':(exclude)tools/verify-za22-live.mjs' ':(exclude).github/workflows/verify-za22-live.yml'
          npm run typecheck 2>&1 | tee "$out/typecheck.log"
          docker build --progress plain --build-arg "TOWN_RELEASE=$GITHUB_SHA" \
            -f tools/Dockerfile.town-preview -t za22-web . 2>&1 | tee "$out/town-preview-build.log"
          docker build --progress plain --build-arg "TOWN_RELEASE=$GITHUB_SHA" \
            -f tools/Dockerfile.town-presence -t za22-presence . 2>&1 | tee "$out/presence-build.log"
      - name: Ride the production cable and inspect the rack from three sides
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/za22-live"
          url=http://127.0.0.1:38100/
          cleanup() {
            docker logs za22-web > "$out/town-preview.log" 2>&1 || true
            docker logs za22-presence > "$out/presence.log" 2>&1 || true
            docker rm -f za22-web za22-presence > /dev/null 2>&1 || true
            docker network rm za22 > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create za22
          # The rack is on the front terrace, before the day/night guard.
          # Keep the ordinary Presence schedule and cable cadence.
          docker run -d --name za22-presence --network za22 --network-alias presence \
            -e PRESENCE_MOUNTAIN_PORT=8091 \
            -e PRESENCE_WEST_PORT=8092 \
            za22-presence
          docker run -d --name za22-web --network za22 \
            -e TOWN_PREVIEW_SITE=:80 -p 127.0.0.1:38100:80 za22-web
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 \
            --max-time 4 "${url}healthz" | tee "$out/healthz.txt"
          test "$(cat "$out/healthz.txt")" = "town-preview $GITHUB_SHA"
          node tools/verify-za22-live.mjs "$url" "$out" starport
      - name: Hash viewport captures
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/za22-live"
          mkdir -p "$out"
          cd "$out"
          find . -type f -name '*.png' -print0 | sort -z | xargs -0 --no-run-if-empty sha256sum > screenshots.sha256
      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zd03-default-starport-walk
          path: ${{ runner.temp }}/za22-live
          if-no-files-found: warn
