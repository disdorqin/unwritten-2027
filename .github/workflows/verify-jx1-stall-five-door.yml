name: Verify JX-1 stall five and the retained home doorway

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-jx1-stall-five-door.yml'
      - 'tools/jx1-stall5/**'

permissions:
  contents: read

jobs:
  stall-five-door:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      JX1_RUNTIME_COMMIT: 2dff658fd664bba873f4ad62293e1f3e1f8d1174
      JX1_DOORS: docs/交流区/GPT/JX-1协作-2026-11-19/b04-production-on-2dff658.patch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: ci
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.JX1_RUNTIME_COMMIT }}
          persist-credentials: false
          path: town
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up the unmodified runtime dependencies
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JX1_RUNTIME_COMMIT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record the original 92 doors and apply the two separate patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jx1-stall5"
          node ci/tools/jx1-formal/record-unmodified-registry.mjs town "$RUNNER_TEMP/jx1-stall5/baseline.json" "$JX1_RUNTIME_COMMIT"
          (cd town && node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . snapshot) > "$RUNNER_TEMP/jx1-stall5/static-baseline.json"
          git -C town apply --check --whitespace=error "../ci/$JX1_DOORS"
          git -C town apply --whitespace=error "../ci/$JX1_DOORS"
          git -C town apply --check --whitespace=error ../ci/tools/jx1-stall5/stall-five-south.patch
          git -C town apply --whitespace=error ../ci/tools/jx1-stall5/stall-five-south.patch
          sha256sum "ci/$JX1_DOORS" ci/tools/jx1-stall5/stall-five-south.patch > "$RUNNER_TEMP/jx1-stall5/patch-sha256.txt"
      - name: Verify the unchanged doors and market regressions
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --import tsx --test tests/town-blockout-house-portals.test.ts tests/town-blockout-market-{layout,fair,residents,banners,venue-activities}.test.ts
          node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . snapshot > "$RUNNER_TEMP/jx1-stall5/static-shifted.json"
          node ../ci/tools/jx1-stall5/compare-stall5-snapshots.mjs "$RUNNER_TEMP/jx1-stall5/static-baseline.json" "$RUNNER_TEMP/jx1-stall5/static-shifted.json" > "$RUNNER_TEMP/jx1-stall5/stall-shift-registry.json"
          node --import tsx ../ci/tools/jx1-formal/check-jx1.mts . candidate "$RUNNER_TEMP/jx1-stall5/static-shifted.json" --require-all --known-book-five > "$RUNNER_TEMP/jx1-stall5/all-house-sweeps.json"
      - name: Walk both ways through the original 186:104 door
        shell: bash
        run: node ci/tools/jx1-formal/verify-jx1-production.mjs town "$RUNNER_TEMP/jx1-stall5/baseline.json" ci/tools/jx1-stall5/door-plan.json "$RUNNER_TEMP/jx1-stall5/door"
      - name: Archive the exact source, registry, frames and native footsteps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jx1-stall-five-door-proof
          path: ${{ runner.temp }}/jx1-stall5
          retention-days: 14
