name: Verify DB-2 moving-target browser controls

on:
  push:
    branches: [lane-build]
    paths:
      - '.github/workflows/verify-db2-browser.yml'
      - 'tools/verify-db2-browser.mjs'

permissions:
  contents: read

jobs:
  moving-target-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB2_BASE: e1931a717320edc87f223ccf0303256da2149881
      DB2_RECEIPT: fcdb709f36c3259f9626fff3f6fae408c83f0c70
      DB2_PATCH: docs/交流区/GPT/分区一冲刺候选/DB2-production-candidate.patch
    steps:
      - name: Check out the browser verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ci
          persist-credentials: false

      - name: Check out the exact review baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.DB2_BASE }}
          path: town
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify and apply the registered candidate
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DB2_BASE"
          git fetch --no-tags --depth=1 origin "$DB2_RECEIPT"
          git show "$DB2_RECEIPT:$DB2_PATCH" > "$RUNNER_TEMP/db2.patch"
          printf '%s  %s\n' f0be0295d589738bcbe16e74d69af5bf670a3a03a65e6494527312714827c343 "$RUNNER_TEMP/db2.patch" | sha256sum --check
          git apply --check --whitespace=error "$RUNNER_TEMP/db2.patch"
          git apply --whitespace=error "$RUNNER_TEMP/db2.patch"
          git diff --check

      - name: Build and verify the desktop and touch rounds
        working-directory: town
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/voxel-tavern --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm --prefix tools/voxel-tavern run build -- --mode town-preview --outDir "$RUNNER_TEMP/db2-dist"
          export DB2_BROWSER_URL=http://127.0.0.1:4173/town-blockout.html
          export DB2_BROWSER_ARTIFACTS="$RUNNER_TEMP/db2-browser-proof"
          mkdir -p "$DB2_BROWSER_ARTIFACTS"
          "$PWD/tools/voxel-tavern/node_modules/.bin/vite" preview tools/voxel-tavern \
            --mode town-preview --outDir "$RUNNER_TEMP/db2-dist" --host 127.0.0.1 --port 4173 --strictPort \
            > "$DB2_BROWSER_ARTIFACTS/preview.log" 2>&1 &
          db2_preview_pid=$!
          trap 'kill "$db2_preview_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --silent --show-error --fail "$DB2_BROWSER_URL" --output /dev/null
          node ../ci/tools/verify-db2-browser.mjs | tee "$DB2_BROWSER_ARTIFACTS/result.log"

      - name: Preserve the browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: db2-moving-target-browser-proof
          path: ${{ runner.temp }}/db2-browser-proof
          retention-days: 14
          if-no-files-found: warn
