name: Verify the P-9 cloud pavilions

on:
  push:
    branches: [lane-c]
    paths:
      - .github/workflows/verify-p9.yml
      - tests/town-blockout-main-summit-pavilions.test.ts
      - tools/verify-main-summit-pavilions-browser.mjs
      - tools/voxel-tavern/main-summit-pavilions-review.html
      - tools/voxel-tavern/town-blockout/main-summit-pavilion*.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Typecheck the review and test both pavilion models
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler tools/voxel-tavern/town-blockout/main-summit-pavilions-review.ts
          node --import tsx --test tests/town-blockout-main-summit-pavilions.test.ts
      - name: Walk both viewing decks
        timeout-minutes: 4
        run: node tools/verify-main-summit-pavilions-browser.mjs . /tmp/p9-evidence
      - name: Upload pavilion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-cloud-pavilion-evidence
          path: /tmp/p9-evidence
          if-no-files-found: warn
