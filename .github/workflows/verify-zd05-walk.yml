name: Verify ZD-05 native island walk and collision

on:
  push:
    branches: [town-verify-zd05-walk-20261120]

permissions:
  contents: read

jobs:
  island:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ZD05_SOURCE: fae14b2d8a1ad8f2fadd0eb1cd6bee025e2fd28f
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ZD05_SOURCE }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and select Chromium
        id: install
        run: |
          test "$(git rev-parse HEAD)" = "$ZD05_SOURCE"
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/voxel-tavern ci --ignore-scripts --no-audit --no-fund
          if browser="$(command -v google-chrome-stable || command -v google-chrome)"; then
            printf 'SKY_CITY_CHROME=%s\n' "$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test island collision, reveal and aircraft flight
        run: >-
          node --import tsx --test
          tests/town-blockout-sky-city.test.ts
          tests/town-blockout-sky-city-reveal.test.ts
          tests/town-blockout-aircraft-flight.test.ts
      - name: Exercise the exact collision model in Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          timeout --signal=TERM --kill-after=10s 60s
          node "$GITHUB_WORKSPACE/tools/verify-sky-city-sweep-browser.mjs" "$RUNNER_TEMP/zd05-walk"
      - name: Walk the island in the built preview
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          timeout --signal=TERM --kill-after=10s 220s
          node tools/verify-sky-city-browser.mjs "$RUNNER_TEMP/zd05-walk"
      - name: Hash native captures and readings
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/zd05-walk"
          cd "$RUNNER_TEMP/zd05-walk"
          find . -maxdepth 1 -type f \( -name '*.jpg' -o -name '*-result.json' \) -print0 |
            sort -z | xargs -0 --no-run-if-empty sha256sum > captures.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zd05-native-walk-fae14b2d
          path: |
            ${{ runner.temp }}/zd05-walk/*.jpg
            ${{ runner.temp }}/zd05-walk/*-result.json
            ${{ runner.temp }}/zd05-walk/captures.sha256
